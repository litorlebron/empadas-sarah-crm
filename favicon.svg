<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Fundo redondo -->
  <circle cx="32" cy="32" r="32" fill="#7a2040"/>

  <!-- Corpo da empada (massa) -->
  <ellipse cx="32" cy="38" rx="20" ry="12" fill="#f5c6a0"/>

  <!-- Topo abaulado da empada -->
  <ellipse cx="32" cy="28" rx="16" ry="11" fill="#e8a87c"/>

  <!-- Brilho no topo -->
  <ellipse cx="28" cy="24" rx="6" ry="4" fill="#f5c6a0" opacity="0.5"/>

  <!-- Borda inferior da massa -->
  <ellipse cx="32" cy="38" rx="20" ry="5" fill="#d4956a"/>

  <!-- Pontinho do recheio no topo -->
  <circle cx="32" cy="22" r="4" fill="#922847"/>
  <circle cx="32" cy="22" r="2.5" fill="#b03358"/>
</svg>
