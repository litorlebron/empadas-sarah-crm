<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Doces & Empadas da Sarah — CRM</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    .login-error {
      background: var(--danger-bg);
      color: var(--danger);
      border: 1px solid rgba(185,28,28,.2);
      border-radius: var(--radius-md);
      padding: var(--space-3) var(--space-4);
      font-size: 13.5px;
      margin-bottom: var(--space-5);
      display: none;
    }
    .login-error.show { display: block; }
    .divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: var(--space-6) 0;
    }
    .login-footer {
      text-align: center;
      font-size: 12px;
      color: var(--text-tertiary);
      margin-top: var(--space-6);
    }
  </style>
</head>
<body>
  <div class="login-page">
    <div class="login-brand">
      <div class="login-brand-logo">
        <svg viewBox="0 0 36 36" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round">
          <circle cx="18" cy="18" r="13" stroke-width="1.5"/>
          <path d="M10 22 Q14 16 18 18 Q22 20 26 16" />
          <path d="M12 18 Q15 13 18 14 Q21 15 24 12" />
        </svg>
      </div>
      <h1>Doces & Empadas<br>da Sarah</h1>
      <p>Sistema de Gestão Comercial</p>
      <div class="login-brand-tagline">
        Controle de vendas, clientes e<br>desempenho em um só lugar.
      </div>
    </div>

    <div class="login-form-panel">
      <div class="login-box">
        <h2>Acesso ao sistema</h2>
        <p class="subtitle">Informe suas credenciais para continuar.</p>

        <div class="login-error" id="loginError"></div>

        <div class="field">
          <label for="email">E-mail</label>
          <input type="email" id="email" placeholder="seuemail@exemplo.com"
            autocomplete="email" autofocus />
        </div>

        <div class="field">
          <label for="password">Senha</label>
          <input type="password" id="password" placeholder="Sua senha"
            autocomplete="current-password" />
        </div>

        <button class="btn btn-primary btn-lg" id="loginBtn">Entrar</button>

        <hr class="divider" />
        <p class="login-footer">Doces & Empadas da Sarah — CRM v1.0</p>
      </div>
    </div>
  </div>

  <!-- Config: chaves públicas apenas -->
  <script src="js/config.js"></script>
  <!-- Supabase UMD via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

  <script>
    const { createClient } = window.supabase;
    const _sb = createClient(
      window.__APP_CONFIG__.SUPABASE_URL,
      window.__APP_CONFIG__.SUPABASE_ANON_KEY
    );

    // Redireciona se já autenticado
    (async () => {
      try {
        const { data: { session } } = await _sb.auth.getSession();
        if (session) window.location.href = 'app.html';
      } catch (_) {}
    })();

    document.getElementById('loginBtn').addEventListener('click', handleLogin);
    document.getElementById('password').addEventListener('keydown', e => { if (e.key === 'Enter') handleLogin(); });
    document.getElementById('email').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('password').focus(); });

    async function handleLogin() {
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn      = document.getElementById('loginBtn');
      const errBox   = document.getElementById('loginError');

      errBox.classList.remove('show');

      if (!email || !password) {
        errBox.textContent = 'Informe e-mail e senha para continuar.';
        errBox.classList.add('show');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Entrando...';

      try {
        const { error } = await _sb.auth.signInWithPassword({ email, password });
        if (error) throw error;
        window.location.href = 'app.html';
      } catch (err) {
        errBox.textContent = 'E-mail ou senha incorretos. Tente novamente.';
        errBox.classList.add('show');
        btn.disabled = false;
        btn.innerHTML = 'Entrar';
      }
    }
  </script>
</body>
</html>
